
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete Student</title>

    <link rel="stylesheet" href="{% static 'registration/style.css' %}">
</head>
<body>

    <h1>Confirm Delete Student</h1>

    <p>Are you sure you want to delete this student record?</p>

    <p>
        <strong>Student ID:</strong> {{ student.student_id }}
    </p>

    <p>
        <strong>Name:</strong>
        {{ student.first_name }} {{ student.last_name }}
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete Student</button>
    </form>

    <br>

    <a href="{% url 'student_detail' student.pk %}">Cancel</a>

</body>
</html>
